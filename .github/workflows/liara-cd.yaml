name: Liara CD (Monolithic)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. تنظیم نسخه نود روی ۲۲ برای رفع خطای crypto.hash
      - uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
      
      # 2. انتقال فایل‌های بیلد شده به پوشه بک‌اند
      - name: Move Frontend Build
        run: |
          mv frontend/dist backend/dist

      # 3. نصب ابزار لیارا
      - name: Install Liara CLI
        run: npm i -g @liara/cli

      # 4. استقرار پوشه backend
      - name: Deploy to Liara
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          cd backend
          liara deploy --api-token="$LIARA_TOKEN" --detach